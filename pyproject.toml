[project]
name = "leggybot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vinicius Sosnowski", email = "vinicius.sosnowski@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gymnasium[classic-control,mujoco]>=1.3.0",
    "imageio>=2.37.3",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "mjlab==1.6.0",
    "torch>=2.11.0",
    "torchvision>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]


[project.scripts]
leggybot = "leggybot:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
